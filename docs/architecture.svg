<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5ff"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="queue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="470" rx="16" fill="url(#bg)"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">RunPod Serverless — request lifecycle</text>

  <!-- Client -->
  <rect x="40" y="90" width="200" height="150" rx="12" fill="url(#client)" stroke="#c7d2fe" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">🐍 Python client</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#475569">scripts/smoke_test.py</text>
  <text x="140" y="164" text-anchor="middle" font-size="12" fill="#475569">scripts/burst_test.py</text>
  <text x="140" y="182" text-anchor="middle" font-size="12" fill="#475569">notebooks/*.ipynb</text>
  <text x="140" y="208" text-anchor="middle" font-size="11" fill="#64748b">httpx · asyncio · REST</text>

  <!-- API gateway -->
  <rect x="320" y="80" width="240" height="170" rx="12" fill="url(#api)"/>
  <text x="440" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">☁️ Endpoint API</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#ddd6fe" font-family="monospace">api.runpod.ai/v2/{id}</text>
  <text x="440" y="158" text-anchor="middle" font-size="12" fill="#ffffff">POST /run · /runsync</text>
  <text x="440" y="178" text-anchor="middle" font-size="12" fill="#ffffff">GET /status/{jobId}</text>
  <text x="440" y="198" text-anchor="middle" font-size="12" fill="#ffffff">GET /health</text>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#ddd6fe">Bearer auth · JSON in/out</text>

  <!-- Queue -->
  <path d="M 640 110 C 640 100, 760 100, 760 110 L 760 210 C 760 220, 640 220, 640 210 Z" fill="url(#queue)"/>
  <ellipse cx="700" cy="110" rx="60" ry="12" fill="#38bdf8"/>
  <text x="700" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">📥 Queue</text>
  <text x="700" y="172" text-anchor="middle" font-size="11" fill="#e0f2fe">jobs wait here</text>
  <text x="700" y="188" text-anchor="middle" font-size="11" fill="#e0f2fe">FIFO · retries</text>

  <!-- Workers -->
  <rect x="640" y="280" width="240" height="120" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="760" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">⚡ Worker pool (0 … N)</text>
  <g>
    <rect x="656" y="318" width="64" height="56" rx="8" fill="url(#worker)"/>
    <text x="688" y="342" text-anchor="middle" font-size="10" fill="#ffffff">GPU</text>
    <text x="688" y="358" text-anchor="middle" font-size="10" fill="#d1fae5">model in</text>
    <text x="688" y="370" text-anchor="middle" font-size="10" fill="#d1fae5">VRAM</text>
    <rect x="728" y="318" width="64" height="56" rx="8" fill="url(#worker)"/>
    <text x="760" y="342" text-anchor="middle" font-size="10" fill="#ffffff">GPU</text>
    <text x="760" y="358" text-anchor="middle" font-size="10" fill="#d1fae5">model in</text>
    <text x="760" y="370" text-anchor="middle" font-size="10" fill="#d1fae5">VRAM</text>
    <rect x="800" y="318" width="64" height="56" rx="8" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="832" y="342" text-anchor="middle" font-size="10" fill="#047857">GPU</text>
    <text x="832" y="358" text-anchor="middle" font-size="10" fill="#047857">spins up</text>
    <text x="832" y="370" text-anchor="middle" font-size="10" fill="#047857">on demand</text>
  </g>
  <text x="760" y="392" text-anchor="middle" font-size="10" fill="#047857">scale to zero when idle</text>

  <!-- Arrows -->
  <line x1="240" y1="165" x2="312" y2="165" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="165" x2="632" y2="165" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="222" x2="700" y2="272" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 640 340 C 560 340, 560 240, 560 220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- Timing callouts -->
  <rect x="60" y="280" width="480" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="306" font-size="13" font-weight="700" fill="#1e293b">⏱️ What the response tells you</text>
  <text x="80" y="330" font-size="12" fill="#475569"><tspan font-weight="700" fill="#0369a1">delayTime</tspan> — queue wait + worker cold start (ms)</text>
  <text x="80" y="352" font-size="12" fill="#475569"><tspan font-weight="700" fill="#047857">executionTime</tspan> — pure GPU inference time (ms)</text>
  <text x="80" y="374" font-size="12" fill="#475569"><tspan font-weight="700" fill="#7c3aed">status</tspan> — IN_QUEUE → IN_PROGRESS → COMPLETED</text>
  <text x="80" y="392" font-size="11" fill="#64748b">Cold start (first request from zero) vs warm (worker active) is the whole game.</text>

  <!-- Footer -->
  <text x="460" y="440" text-anchor="middle" font-size="12" fill="#64748b">💸 Billed per second, worker start → full stop · nothing idle, nothing wasted</text>
</svg>
